# version: '3.8'

services:
  backend:
    container_name: ridenitt-backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
        - "3000:3000"
    env_file:
      - .env
    restart: always
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - ridenitt-network
    
networks:
  ridenitt-network:
    external: true
